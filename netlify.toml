[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Static export: no Next.js runtime is needed, so skip the plugin's SSR path.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Hidden pages: noindex in the page metadata and in the header. Add one block
# per entry in hiddenPages (lib/content.ts); scripts/check-build.mjs fails the
# build if one is missing.
[[headers]]
  for = "/marine/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Private pitches: noindex, and never linked or listed (app/(pitch)/).
[[headers]]
  for = "/pitch/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Client profile intake: sent by hand, never linked or listed (app/(intake)/).
[[headers]]
  for = "/client-profile/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/client/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/portal-data/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pitch-data/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Legacy leather-goods store: send people to the page that exists.
[[redirects]]
  from = "/products/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/collections/*"
  to = "/"
  status = 301

# Typical store paths, not yet verified against the old site. Confirm them
# against Search Console's page list before enabling (crawl finding 1).
# [[redirects]]
#   from = "/pages/*"
#   to = "/"
#   status = 301
# [[redirects]]
#   from = "/blogs/*"
