#   status = 301
# [[redirects]]
#   from = "/cart"
#   to = "/"
#   status = 301
# [[redirects]]
#   from = "/account/*"
#   to = "/"
#   status = 301

# The old /process page moved into /services/.
[[redirects]]
  from = "/process/*"
  to = "/services/#process"
  status = 301

# The Netlify alias serves the whole site: one host only.
[[redirects]]
  from = "https://findyourasri.netlify.app/*"
  to = "https://findyourasri.com/:splat"
  status = 301
  force = true
